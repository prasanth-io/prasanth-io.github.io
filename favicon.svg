<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">

<style>
@keyframes blink {
  0%,50%,100% { opacity: 1; }
  25%,75% { opacity: 0; }
}

rect {
  fill: black;
  animation: blink 1s steps(1) infinite;
}

@media (prefers-color-scheme: dark) {
  rect {
    fill: white;
  }
}
</style>

<rect x="6" y="2" width="4" height="12"/>

</svg>
